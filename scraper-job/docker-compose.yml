services:
  # ── Redis (Celery broker + result backend) ────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build: .
    command: celery -A app.workers.pipeline.celery_app worker -Q analysis,celery --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Flower (monitoring dashboard, optional) ────────────────────────
  flower:
    build: .
    command: celery -A app.workers.pipeline.celery_app flower --port=5555 --address=0.0.0.0 --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
      - worker

volumes:
  redis_data:
