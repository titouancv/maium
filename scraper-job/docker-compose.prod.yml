services:
  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI (production) ───────────────────────────────────────────────────
  api:
    build: .
    # CMD from Dockerfile is used — no --reload, 2 workers
    restart: always
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build: .
    command: celery -A app.workers.pipeline.celery_app worker -Q analysis,celery --loglevel=info --concurrency=4
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Flower (monitoring) ─────────────────────────────────────────────
  flower:
    build: .
    command: celery -A app.workers.pipeline.celery_app flower --port=5555 --address=0.0.0.0 --broker=redis://redis:6379/0
    restart: always
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
      - worker

volumes:
  redis_data:
