name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "scraper-job/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "scraper-job/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-job

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper-job/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

  imports:
    name: Import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-job

    env:
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
      MISTRAL_API_KEY: "placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper-job/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check all imports resolve
        run: python -c "from app.main import app; print('OK')"
